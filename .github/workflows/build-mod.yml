name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Fabric mod
        run: gradle clean remapJar --no-daemon --stacktrace

      - name: Verify JAR
        run: |
          find build/libs -maxdepth 1 -type f -name "*.jar" -print
          test -n "$(find build/libs -maxdepth 1 -type f -name "*.jar" -print -quit)"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-x-mincraft-mod
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
