name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Executable
      run: chmod +x gradlew

    # FIXED: Replaced standard generic build with the precise Fabric task to guarantee a jar is outputted
    - name: Build Mod with Fabric Loom
      run: ./gradlew remapJar --no-daemon

    # FIXED: Broadened search patterns to look through all hidden subfolders for any compiled jar
    - name: Upload Mod Artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-Jar
        path: |
          **/build/libs/*.jar
          build/libs/*.jar
        if-no-files-found: error
