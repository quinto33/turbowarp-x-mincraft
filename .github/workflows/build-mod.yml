name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # FIXED: Re-added the executable bit for the gradlew wrapper script you added earlier
    - name: Make Gradle Executable
      run: chmod +x gradlew

    # FIXED: Directs the wrapper script explicitly to build the jar asset bundles
    - name: Build Mod with Gradle Wrapper
      run: ./gradlew build

    # FIXED: Multi-path catch-all search pattern to guarantee the file is collected regardless of the subfolder destination
    - name: Upload Mod Artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-Jar
        path: |
          **/build/libs/*.jar
          build/libs/*.jar
