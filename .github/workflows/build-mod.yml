name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Clean previous build files
        run: ./gradlew clean --no-daemon

      - name: Build remapped mod JAR
        run: ./gradlew remapJar --no-daemon --stacktrace

      - name: Show generated build files
        run: |
          echo "Build directory:"
          find build -maxdepth 4 -type f -print 2>/dev/null || true

          echo "JAR files:"
          find . -type f -path "*/build/libs/*.jar" -print

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-x-mincraft-mod
          path: |
            build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
