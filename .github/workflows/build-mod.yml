name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # FIXED: Directs the compiler to natively assemble everything
    - name: Build Mod with Gradle
      run: gradle build --no-daemon

    # FIXED: Uses a global search pattern to find and upload the jar file wherever it is generated
    - name: Upload Mod Artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-Jar
        path: "**/build/libs/*.jar"
        if-no-files-found: error
