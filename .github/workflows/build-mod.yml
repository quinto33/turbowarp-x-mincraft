name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build Fabric mod JAR
        run: gradle clean remapJar --no-daemon --stacktrace

      - name: Verify generated JAR
        run: |
          echo "Generated JAR files:"
          find . -type f -name "*.jar" -print

          test -n "$(find build/libs -maxdepth 1 -type f -name "*.jar" -print -quit)" || {
            echo "ERROR: No JAR was created in build/libs."
            exit 1
          }

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-x-mincraft-mod
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
