name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build project
        run: ./gradlew build --no-daemon --stacktrace

      - name: List all generated files
        run: |
          echo "All JAR files:"
          find . -type f -name "*.jar" -print || true

          echo "Build directories:"
          find . -type d -name "build" -print || true

          echo "Build contents:"
          find . -type f -path "*/build/*" -print || true

      - name: Copy the mod JAR to a known location
        run: |
          mkdir -p upload

          JAR_FILE=$(find . -type f \
            -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Gradle did not produce a mod JAR."
            exit 1
          fi

          echo "Found mod JAR: $JAR_FILE"
          cp "$JAR_FILE" upload/turbowarp-x-mincraft.jar
          ls -l upload

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: turbowarp-x-mincraft-mod
          path: upload/turbowarp-x-mincraft.jar
          if-no-files-found: error
          compression-level: 0
